[project]
name = "phishguard"
version = "1.0.0"
description = "PhishGuard: Defensive Phishing Email and URL Threat Analysis Platform"
authors = [{ name = "Mayaman Ram" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "tldextract>=5.1.0",
    "reportlab>=4.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "ruff>=0.5.0",
]

[tool.pyright]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "data",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

